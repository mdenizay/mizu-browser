[package]
name = "mizu-adblock"
version = "0.1.0"
edition = "2021"
license = "MIT"
publish = false

[lib]
name = "mizu_adblock"
crate-type = ["staticlib"]

[dependencies]
adblock = { version = "0.13", default-features = false, features = ["content-blocking", "embedded-domain-resolver", "full-regex-handling"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true
